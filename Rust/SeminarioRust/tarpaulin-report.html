    pub fn registrar_venta(\u0026mut self, venta: Venta){\n        self.ventas_realizadas.push_back(venta);\n    }\n    pub fn registro_por_categoria(\u0026self) -\u003e String{\n        let mut registro = \"Categoria -- Monto por categoria\".to_string();\n        let mut iter_v = self.ventas_realizadas.iter().clone();\n\n        let mut aux: HashMap\u003cString, f64\u003e = HashMap::new();\n\n        for v in iter_v{\n            let mut iter_p = v.productos.clone().iter();\n            for (c,p) in \u0026v.productos{\n                *aux.entry(p.categoria.clone()).or_insert(0.0) += *c as f64 * p.precio_base;\n            }\n        }\n\n        for r in aux{\n            registro = format!(\"{}{}{}{}{}\",registro, r.0, \" --     \", r.1, \"\\n\");\n        }\n        registro\n    }\n    pub fn registro_por_medio_de_pago(\u0026self) -\u003e String{\n        let mut registro = \"Medio de pago -- Monto por medio\".to_string();\n        let mut iter_v = self.ventas_realizadas.iter().clone();\n\n        let mut aux: HashMap\u003cString, f64\u003e = HashMap::new();\n        let mut clave: String;\n\n        for v in iter_v{\n            clave = format!(\"{:?}\", v.medio_de_pago);\n            *aux.entry(clave.clone()).or_insert(0.0) += v.calcular_precio_final(self);\n        }\n\n        for r in aux{\n            registro = format!(\"{}{}{}{}{}\",registro, r.0, \" --     \", r.1, \"\\n\");\n        }\n        registro\n    }\n}\nimpl Venta{\n    pub fn new(fecha: Fecha, cliente: Cliente, vendedor: Vendedor, \n        medio_de_pago: MedioDePago, productos: VecDeque\u003c(u8, Producto)\u003e) -\u003e Venta{\n        Venta { fecha, cliente, vendedor, medio_de_pago, productos }\n    }\n    pub fn calcular_precio_final(\u0026self, sistema: \u0026Sistema) -\u003e f64{\n        let mut total = 0.0;\n        let mut iter_v = self.productos.iter().clone();\n\n        for v in iter_v{\n            let mut descuento = 0;\n            match sistema.descuentos_por_categoria.get(\u0026v.1.categoria){\n                Some(d) =\u003e (descuento = *d),\n                None =\u003e ()\n            }\n            total += v.0 as f64 * (v.1.precio_base - (v.1.precio_base * (descuento / 100) as f64));\n        }\n        total - (total * (sistema.descuento_por_newsletter / 100) as f64)\n    }\n    \n}","traces":[{"line":48,"address":[1146272],"length":1,"stats":{"Line":0}},{"line":49,"address":[1146289],"length":1,"stats":{"Line":0}},{"line":51,"address":[1147898,1146336,1147480],"length":1,"stats":{"Line":0}},{"line":52,"address":[1146366],"length":1,"stats":{"Line":0}},{"line":53,"address":[1146409,1146470],"length":1,"stats":{"Line":0}},{"line":55,"address":[1146485],"length":1,"stats":{"Line":0}},{"line":57,"address":[1146593,1146492],"length":1,"stats":{"Line":0}},{"line":58,"address":[1146742,1147502],"length":1,"stats":{"Line":0}},{"line":59,"address":[1147875,1147569],"length":1,"stats":{"Line":0}},{"line":60,"address":[1147759],"length":1,"stats":{"Line":0}},{"line":64,"address":[1146764,1146932],"length":1,"stats":{"Line":0}},{"line":65,"address":[1147176,1147001,1147370],"length":1,"stats":{"Line":0}},{"line":67,"address":[1147094],"length":1,"stats":{"Line":0}},{"line":69,"address":[1147920,1149644,1149218],"length":1,"stats":{"Line":0}},{"line":70,"address":[1147950],"length":1,"stats":{"Line":0}},{"line":71,"address":[1148081,1148017],"length":1,"stats":{"Line":0}},{"line":73,"address":[1148096],"length":1,"stats":{"Line":0}},{"line":74,"address":[1148103],"length":1,"stats":{"Line":0}},{"line":76,"address":[1149599,1148207,1148111],"length":1,"stats":{"Line":0}},{"line":77,"address":[1149416,1149224,1148356,1149397],"length":1,"stats":{"Line":0}},{"line":78,"address":[1149499,1149384],"length":1,"stats":{"Line":0}},{"line":81,"address":[1148389,1148557],"length":1,"stats":{"Line":0}},{"line":82,"address":[1148626,1149092,1148898],"length":1,"stats":{"Line":0}},{"line":84,"address":[1148717],"length":1,"stats":{"Line":0}},{"line":88 ize, Deserialize)]\npub struct Fiat {\n    pub nombre: String,\n    pub prefijo: String,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct Criptomoneda {\n    pub nombre: String,\n    pub prefijo: String,\n    pub blockchains: VecDeque\u003cBlockchain\u003e,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct Blockchain {\n    pub nombre: String,\n    pub prefijo: String,\n}\n\nimpl Plataforma {\n    pub fn new(nombre: String, path_archivo: String) -\u003e Plataforma {\n        let mut plataf = Plataforma {\n            nombre,\n            usuarios: HashMap::new(),\n            registro: HashMap::new(),\n            tabla_cotizacion: HashMap::new(),\n            path_archivo,\n        };\n        let _ = plataf.guardar_datos();\n        plataf\n    }\n\n    pub fn guardar_datos(\u0026self) -\u003e Result\u003c(), std::io::Error\u003e {\n        let datos_serializados = serde_json::to_string_pretty(self)?;\n        let mut archivo = File::create(\u0026self.path_archivo)?;\n        archivo.write_all(datos_serializados.as_bytes())?;\n        Ok(())\n    }\n\n    pub fn cargar_datos(\u0026self) -\u003e Result\u003cPlataforma, std::io::Error\u003e {\n        let archivo = File::open(\u0026self.path_archivo)?;\n        let lector = BufReader::new(archivo);\n        let plataforma_cargada = serde_json::from_reader(lector)?;\n        Ok(plataforma_cargada)\n    }\n\n    pub fn registrar_usuario(\u0026mut self, usuario: Usuario) {\n        self.usuarios.insert(usuario.dni, usuario);\n        let _ = self.guardar_datos();\n    }\n\n    pub fn registrar_transaccion(\u0026mut self, transaccion: Transaccion) {\n        self.registro.entry(transaccion.usuario.dni).or_insert(VecDeque::new()).push_back(transaccion);\n        let _ = self.guardar_datos();\n    }\n\n    pub fn ingresar_dinero(\u0026mut self, fecha: Fecha, monto_fiat: (Fiat, f64), usuario: \u0026mut Usuario) {\n        let tipo: String = \"(ingreso de dinero)\".to_string();\n        let fiat: String = monto_fiat.0.nombre;\n        if self.usuarios.contains_key(\u0026usuario.dni) {\n            *usuario.balance.entry(fiat.clone()).or_insert(0.0) += monto_fiat.1;\n            self.usuarios.insert(usuario.dni, usuario.clone());\n            \n            let transaccion = Transaccion {\n                fecha,\n                tipo,\n                monto: monto_fiat.1,\n                usuario: usuario.clone(),\n                criptomoneda: None,\n                cotizacion: None,\n                blockchain: None,\n                hash: None,\n                medio_retiro: None,\n            };\n            self.registrar_transaccion(transaccion);\n        } else {\n            panic!(\"Usuario no registrado\");\n        }\n    }\n\n    pub fn obtener_cotizacion(\u0026self, nombre_a: \u0026String, nombre_b: \u0026String) -\u003e f64 {\n        if let Some(lista) = self.tabla_cotizacion.get(nombre_a) {\n            for m in lista {\n                if m.0.eq(nombre_b) {\n                    return m.1;\n                }\n            }\n        }\n        panic!(\"Esta moneda no cuenta con una cotizacion para la moneda solicitada\");\n    }\n    \n    pub fn cripto_mas_cantidad_ventas(\u0026self) -\u003e Option\u003cString\u003e {\n        let mut conteo = HashMap::new();\n        for lista in self.registro.values() {\n            for tx in lista {\n                if tx.tipo == \"venta de cripto\" {\n                    if let Some(ref cripto) = tx.criptomoneda {\n                        *conteo.entry(cripto.clone()).or_insert(0) += 1;\n                    }\n                }\n            }\n        }\n        conteo.into_iter().max_by_key(|\u0026(_, count)| count).map(|(name, _)| name)\n    }\n\n    pub fn cripto_mas_cantidad_compras(\u0026self) -\u003e Option\u003cString\u003e {\n        let mut conteo = HashMap::new();\n        for lista in self.registro.values() {\n            for tx in lista {\n                if tx.tipo == \"compra de cripto\" {\n                    if let Some(ref cripto) = tx.criptomoneda {\n                        *conteo.entry(cripto.clone()).or_insert(0) += 1;\n                    }\n                }\n            }\n        }\n        conteo.into_iter().max_by_key(|\u0026(_, count)| count).map(|(name, _)| name)\n    }\n\n    pub fn cripto_mas_volumen_ventas(\u0026self) -\u003e Option\u003cString\u003e {\n        let mut volumenes = HashMap::new();\n        for lista in self.registro.values() {\n            for tx in lista {\n                if tx.tipo == \"venta de cripto\" {\n                    if let Some(ref cripto) = tx.criptomoneda {\n                        *volumenes.entry(cripto.clone()).or_insert(0.0) += tx.monto;\n                    }\n                }\n            }\n        }\n        volumenes.into_iter().max_by(|a, b| a.1.partial_cmp(\u0026b.1).unwrap_or(std::cmp::Ordering::Equal)).map(|(name, _)| name)\n    }\n\n    pub fn cripto_mas_volumen_compras(\u0026self) -\u003e Option\u003cString\u003e {\n        let mut volumenes = HashMap::new();\n        for lista in self.registro.values() {\n            for tx in lista {\n                if tx.tipo == \"compra de cripto\" {\n                    if let Some(ref cripto) = tx.criptomoneda {\n                        *volumenes.entry(cripto.clone()).or_insert(0.0) += tx.monto;\n                    }\n                }\n            }\n        }\n        volumenes.into_iter().max_by(|a, b| a.1.partial_cmp(\u0026b.1).unwrap_or(std::cmp::Ordering::Equal)).map(|(name, _)| name)\n    }\n}\n\nimpl Usuario {\n    pub fn new(nombre: String, apellido: String, email: String, dni: u64, identidad_validada: bool) -\u003e Usuario {\n        Usuario { nombre, apellido, email, dni, identidad_validada, balance: HashMap::new() }\n    }\n\n    pub fn comprar_criptomoneda(\u0026mut self, fecha: Fecha, monto_en_fiat: (Fiat, f64), cripto: Criptomoneda, sistema: \u0026mut Plataforma) {\n        if !self.identidad_validada { panic!(\"Usuario no validado\"); }\n        let fiat = monto_en_fiat.0.nombre;\n        let monto = monto_en_fiat.1;\n        \n        if let Some(cantidad) = self.balance.get(\u0026fiat) {\n            if *cantidad \u003e= monto {\n                let cotizacion = sistema.obtener_cotizacion(\u0026fiat, \u0026cripto.nombre);\n                let monto_final = monto * cotizacion;\n                *self.balance.get_mut(\u0026fiat).unwrap() -= monto;\n                *self.balance.entry(cripto.nombre.clone()).or_insert(0.0) += monto_final;\n                \n                sistema.usuarios.insert(self.dni, self.clone());\n                \n                let tx = Transaccion {\n                    fecha,\n                    tipo: \"compra de cripto\".to_string(),\n                    monto: monto_final,\n                    usuario: self.clone(),\n                    criptomoneda: Some(cripto.nombre),\n                    cotizacion: Some(cotizacion),\n                    blockchain: None,\n                    hash: None,\n                    medio_retiro: None,\n                };\n                sistema.registrar_transaccion(tx);\n            } else { panic!(\"Balance fiat insuficiente\"); }\n        } else { panic!(\"El usuario no cuenta con acceso a la moneda de ingreso\"); }\n    }\n\n    pub fn vender_criptomoneda(\u0026mut self, fecha: Fecha, monto_en_cripto: (Criptomoneda, f64), fiat: Fiat, sistema: \u0026mut Plataforma) {\n        if !self.identidad_validada { panic!(\"Usuario no validado\"); }\n        let cripto = monto_en_cripto.0.nombre;\n        let monto = monto_en_cripto.1;\n        \n        if let Some(cantidad) = self.balance.get(\u0026cripto) {\n            if *cantidad \u003e= monto {\n                let cotizacion = sistema.obtener_cotizacion(\u0026cripto, \u0026fiat.nombre);\n                let monto_final = monto * cotizacion;\n                *self.balance.get_mut(\u0026cripto).unwrap() -= monto;\n                *self.balance.entry(fiat     <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/').map(decodeURIComponent);
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      const nbHit = covered? trace.stats.Line: 0;
      return e(
        'div',
        { className: 'code-text-container' },
        e(
          'code',
          {
            className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          },
          line
        ),
        e(
          'div',
          { className: 'cover-indicator' + (covered? ' check-cover': '') + (uncovered? ' no-cover': '')},
          e(
            'div',
            { className: (covered? 'stat-line-hit': '')},
            covered? nbHit: ""
          )
        )
      );
    }),
  );
}

(function () {
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData &&
    previousData.files.forEach(file => {
      const path = file.path.slice(commonPath.length).join('/');
      prevFilesMap.set(path, file);
    });

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    const {covered = 0, coverable = 0} = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: {covered, coverable},
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
</script>
